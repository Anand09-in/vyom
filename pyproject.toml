[project]
name = "vyom"
version = "1.0.0"
description = "Vyom — multi-source agentic RAG over Indian fintech data (BSE + SEBI + RBI)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "numpy>=1.26",
    "tenacity>=8.3",
    "pypdf>=4.2",
    "redis>=5.0",
]

[project.optional-dependencies]
local = [
    "sentence-transformers>=3.0",
    "ollama>=0.3",
    "einops>=0.7",
]
cloud = [
    "boto3>=1.34",
    "langchain-aws>=0.2",
]
api = [
    "fastapi>=0.111,<0.120",
    "starlette<0.49",
    "uvicorn[standard]>=0.30",
    "mangum>=0.17",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pre-commit>=3.7",
    "ragas>=0.2",
    "mlflow>=2.14",
    "datasets>=2.20",
    "langchain-openai>=0.1",
    # ragas hard-imports langchain_community.chat_models.vertexai, which was
    # removed when langchain-community started sunsetting in 0.4.x — pin below
    # that until ragas stops eagerly importing it.
    "langchain-community<0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vyom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: requires live DB or models",
    "slow: takes more than 10 seconds",
]